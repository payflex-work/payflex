# GitBook site structure — the canonical contract for site-wide Git Sync.
# Schema: https://api.gitbook.com/gitbook-docs.yaml
#
# PayFlex is documented as ONE book spanning the monorepo: the root README,
# backend/README.md, app/README.md and the docs/ design files cross-link
# each other with relative paths (e.g. backend/README.md → ../README.md).
# GitBook spaces are self-contained (a space cannot reach sibling
# directories), so per-directory spaces would break those links and
# duplicate content. One space rooted at / keeps every link resolvable;
# navigation is defined by /SUMMARY.md, per /.gitbook.yaml.
$schema: https://api.gitbook.com/gitbook-docs.yaml

site:
  title: PayFlex
  structure:
    - type: space
      key: space-payflex-docs
      title: PayFlex
      path: payflex
      default: true
      content:
        directory: /
