# Render Blueprint — PayFlex backend (Docker deploy).
# Apply via: Render Dashboard → New → Blueprint → select this repo.
# Docs: https://render.com/docs/blueprint-spec
#
# Migrations: the image ENTRYPOINT runs `prisma migrate deploy` before the
# server starts, and preDeployCommand below runs it again in a dedicated
# release phase before the new build goes live. Both are idempotent — a
# double run is a no-op, so this is belt-and-braces, not a bug.
services:
  - type: web
    name: payflex-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter # right-size for production; free tier cold-starts
    healthCheckPath: /v1/health
    autoDeploy: true
    preDeployCommand: "npx prisma migrate deploy"
    envVars:
      # Stellar is the only payment rail. Testnet by default; mainnet also
      # requires STELLAR_HORIZON_URL or the app refuses to boot (deliberate
      # gate — see backend/src/config/stellar.config.ts).
      - key: STELLAR_NETWORK
        value: testnet
      # Leave blank on testnet to use the SDF defaults; required on mainnet.
      - key: STELLAR_HORIZON_URL
        sync: false
      - key: STELLAR_FRIENDBOT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true # rotating this logs every user out (see .env.example)
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: payflex-db
          property: connectionString

databases:
  - name: payflex-db
    databaseName: payflex
    user: payflex
    plan: free # upgrade before production; free-tier Postgres expires
    postgresMajorVersion: "16"
