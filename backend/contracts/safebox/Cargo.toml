[package]
name = "payflex-safebox"
version = "0.1.0"
edition = "2021"
publish = false
description = "PayFlex Safebox — Soroban escrow contract: owner/admin-only withdrawal, 3-admin cap, shared on-chain ledger."

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "23"

[dev-dependencies]
soroban-sdk = { version = "23", features = ["testutils"] }
