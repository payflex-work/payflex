version: "3.8"

# Local dev infra only — Postgres for the app DB (including the login
# challenge store; see src/auth/auth.service.ts). Nothing else runs here:
# Stellar (Horizon/Friendbot) is a public network the app and backend talk
# to over the internet, not something we host.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payflex
      POSTGRES_PASSWORD: payflex
      POSTGRES_DB: payflex
    ports:
      - "5432:5432"
    volumes:
      - payflex_postgres_data:/var/lib/postgresql/data

volumes:
  payflex_postgres_data:
