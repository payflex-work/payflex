name: Backend tests

# Run the backend test suite (Jest, config test/jest-e2e.json) on every push.
#
# These are real e2e specs: each one boots the full AppModule over an HTTP
# listener with only StellarService stubbed, writes real rows, and asserts
# against real responses. That requires the same boot-critical environment
# production has — all three are enforced at DI time and the app refuses to
# start without them:
#   - DATABASE_URL       PrismaService (app data + the login-challenge store)
#   - JWT_SECRET         token.module.ts
#   - QR_SIGNING_SECRET  hmac-token.service.ts
# A Postgres service is provisioned below and `prisma migrate deploy`
# applies every migration before tests run, so the schema — including the
# Postgres-backed LoginChallenge table that replaced Redis (43d2cfb) — is
# always present. Values marked ci-only are throwaways scoped to this job.
#
# Historics: this job was created when the suite was pure unit tests (no
# DB/env needed). 31653cd introduced the e2e specs without updating this
# job, which is why CI stayed red through the docs-only commits that
# followed. Flutter CI remains in flutter-tests.yml; the container-level
# equivalent of this flow (image + fresh-DB migration + /v1/health) lives
# in backend-docker.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: E2E tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://payflex:payflex@localhost:5432/payflex?schema=public
      JWT_SECRET: ci-only-secret-not-for-production
      QR_SIGNING_SECRET: ci-only-secret-not-for-production
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payflex
          POSTGRES_PASSWORD: payflex
          POSTGRES_DB: payflex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payflex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
