name: Docs links

# Check that every relative link in the root README and the docs/ set
# resolves — file targets, GitHub anchors, same-page anchors. This is the
# automated form of the docs rule: an out-of-date doc here is a claim the
# app doesn't back; a broken link is a claim nobody can follow.
# Pure-static check (no network): external http(s) links are deliberately
# out of scope, since a URL can rot for reasons a doc PR neither caused
# nor can fix. The checker itself lives in scripts/check_doc_links.py;
# `npm run check:docs` runs it locally the same way CI does.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Relative links + anchors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check relative links in README and docs/
        run: python3 scripts/check_doc_links.py
