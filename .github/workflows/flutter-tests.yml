name: Flutter tests

# Analyze + unit-test the Flutter app (app/). Pure Dart tests — no device,
# emulator, or running backend needed. The repo has no android/ios platform
# folders (those are generated on dev machines via `flutter create`, see the
# root README), and `flutter analyze` / `flutter test` don't require them.
#
# pubspec.yaml requires Dart ^3.9.0 / Flutter >=3.29.0 — the stable channel
# satisfies both. Pin flutter-version here if you ever need a reproducible
# SDK across runs.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: flutter-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # The codebase currently has ~71 pre-existing lint infos/warnings
        # (prefer_const, deprecations, unused imports) but 0 errors — see the
        # README's verification status. --no-fatal-* keeps those visible in
        # the log without failing the build; a genuine error still fails.
        # Tighten to a fully clean `flutter analyze` once the lints are fixed.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test
