name: payflex
description: >-
  PayFlex — mobile-first, non-custodial payments app on Stellar. Every user
  IS a Stellar account: the keypair is generated on-device, the secret seed
  never leaves the phone, and every payment is built, signed, and submitted
  from the device. Fiat on/off-ramps and identity verification are
  deliberately NOT implemented — see docs/fiat-kyc-gap.md.
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '^3.9.0'
  # mobile_scanner 7.x (Phase 3) needs >=3.29.0 — kept in sync here rather
  # than leaving a lower bound none of our own dependencies actually allow.
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  # QR Pay: render a payment QR and scan one to pay.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  # Stellar — the ONLY payment rail. Official SDK: builds/signs/submits
  # Stellar transactions and queries Horizon. Never implement Stellar key
  # generation/signing outside this package.
  stellar_flutter_sdk: ^3.6.0
  # Real device keychain/keystore for the Stellar secret key (not
  # SharedPreferences) — already pulled in transitively by
  # stellar_flutter_sdk; declared directly since lib/stellar/ uses it.
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # The approved PayFlex brand mark (QR-corners + flowing arrow on the
    # logo's navy container). Full design-token guidance: root README.
    # §9 (UI/UX & Motion Design Brief v2).
    - assets/brand/
