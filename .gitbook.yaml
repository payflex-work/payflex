# GitBook Git Sync — space configuration.
# Docs: https://gitbook.com/docs/docs-as-code/git-sync/content-configuration
#
# This repo is a monorepo (app/ + backend/ + docs/); GitBook reads the whole
# tree as one space, with SUMMARY.md defining the navigation so the two
# package READMEs and the design docs surface in a deliberate order instead
# of alphabetical folder order.
root: ./

structure:
  readme: README.md
  summary: SUMMARY.md
